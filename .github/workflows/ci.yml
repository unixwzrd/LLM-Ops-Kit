name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up UV
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
          enable-cache: true

      - name: Install shellcheck
        shell: bash
        run: |
          case "$(uname -m)" in
            arm64) shellcheck_arch=aarch64 ;;
            x86_64) shellcheck_arch=x86_64 ;;
            *) echo "unsupported CI architecture: $(uname -m)" >&2; exit 2 ;;
          esac
          curl -fsSL --retry 3 "https://github.com/koalaman/shellcheck/releases/download/stable/shellcheck-stable.darwin.${shellcheck_arch}.tar.xz" -o "$RUNNER_TEMP/shellcheck.tar.xz"
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-stable" >> "$GITHUB_PATH"

      - name: Install locked development environment
        run: uv sync --locked --extra tui

      - name: Run release precheck
        run: |
          uv run --locked --extra tui ./scripts/precheck --release
