[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "llm-ops-kit"
version = "0.9.0b18"
description = "Local-first control plane for models, agents, proxies, and supporting AI services"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE.md" }
authors = [{ name = "LLM-Ops-Kit contributors" }]
dependencies = ["jinja2>=3.1,<4", "jsonschema>=4.23,<5", "rich>=13.9,<15"]

[project.optional-dependencies]
tui = ["textual>=0.89,<2"]

[project.scripts]
llmops = "llmops_kit.entrypoint:main"

[project.entry-points."llmops.adapters"]
builtin = "llmops_kit.llmops_adapters:register_builtin_adapters"

[tool.hatch.build.targets.wheel]
packages = ["src/llmops_kit"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/templates" = "llmops_kit/resources/templates"

[tool.hatch.build.targets.sdist]
include = [
  "/src/llmops_kit",
  "/scripts/templates",
  "/README.md",
  "/LICENSE.md",
  "/CHANGELOG.md",
]
